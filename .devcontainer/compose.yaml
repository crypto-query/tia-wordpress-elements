services:
    workspace:
        build:
            context: .
            dockerfile: dockerfile
            args:
                USER: ${USER}
                HOME: ${HOME}
        network_mode: host
        init: true
        cap_add:
            - SYS_ADMIN
        volumes:
            - ${HOME}:${HOME}/.host-home:ro
            - ${HOME}/.ssh:${HOME}/.ssh:ro
        command: sleep infinity

    # WordPress core and the database live in named volumes; this repo (the plugin) and the TIA theme are bind-mounted.
    # The plugins under wordpress/plugins/ come from `bun run wp:plugins`; run it before the first start.
    wordpress:
        image: wordpress:php8.3
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - wordpress:/var/www/html
            - ..:/var/www/html/wp-content/plugins/tia-wordpress-elements
            - ../wordpress/themes/tia:/var/www/html/wp-content/themes/tia
            - ../wordpress/plugins/woocommerce:/var/www/html/wp-content/plugins/woocommerce
            - ../wordpress/plugins/woocommerce-subscriptions:/var/www/html/wp-content/plugins/woocommerce-subscriptions
            - ../wordpress/plugins/block-visibility:/var/www/html/wp-content/plugins/block-visibility
        ports:
            - 8000:80
        restart: always
        environment:
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_HOST: database:3306

    database:
        image: mysql:8.4
        volumes:
            - database:/var/lib/mysql
        ports:
            - 3306:3306
        restart: always
        environment:
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
            MYSQL_ROOT_PASSWORD: wordpress
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 3

volumes:
    wordpress:
    database:
